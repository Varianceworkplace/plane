name: Plane CI/CD

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/varianceworkplace

jobs:
  build:
    name: Build and Push Plane Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.web
          push: true
          tags: ghcr.io/varianceworkplace/plane-frontend:${{ github.sha }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.api
          push: true
          tags: ghcr.io/varianceworkplace/plane-backend:${{ github.sha }}

      - name: Build and push admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile.admin
          push: true
          tags: ghcr.io/varianceworkplace/plane-admin:${{ github.sha }}

      - name: Build and push space
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/space/Dockerfile.space
          push: true
          tags: ghcr.io/varianceworkplace/plane-space:${{ github.sha }}

      - name: Build and push live
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/live/Dockerfile.live
          push: true
          tags: ghcr.io/varianceworkplace/plane-live:${{ github.sha }}

  deploy:
    name: Deploy Plane to Server
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy Plane
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE: ${{ github.sha }}
          IMAGE_PREFIX: ghcr.io/varianceworkplace
        run: |
          set -euo pipefail

          echo "Deploying Plane release: $RELEASE"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_RELEASE='$RELEASE' PLANE_IMAGE_PREFIX='$IMAGE_PREFIX' bash -s" <<'REMOTE'
          set -euo pipefail

          cd /opt/plane-selfhost

          echo "1. Validating Docker Compose configuration..."
          docker compose --env-file plane.env config --quiet

          echo "2. Checking resolved application images..."
          IMAGES="$(docker compose --env-file plane.env config --images)"
          printf '%s\n' "$IMAGES"

          for image in \
            "plane-frontend" \
            "plane-backend" \
            "plane-admin" \
            "plane-space" \
            "plane-live"
          do
            if ! printf '%s\n' "$IMAGES" |
              grep -Fq "ghcr.io/varianceworkplace/${image}:${APP_RELEASE}"; then
              echo "ERROR: Expected GHCR image not found: ${image}:${APP_RELEASE}"
              exit 1
            fi
          done

          echo "3. Pulling application images..."
          docker compose --env-file plane.env pull \
            web admin space live api worker beat-worker migrator

          echo "4. Running database migrations..."
          docker compose --env-file plane.env run --rm migrator

          echo "5. Updating application services..."
          docker compose --env-file plane.env up -d --no-deps \
            api worker beat-worker web admin space live

          echo "6. Waiting briefly for services to start..."
          sleep 20

          echo "7. Current service status..."
          docker compose --env-file plane.env ps

          echo "8. Verifying deployed application images..."
          for service in api worker beat-worker web admin space live; do
            container="plane-selfhost-${service}-1"

            if ! docker inspect "$container" >/dev/null 2>&1; then
              echo "ERROR: Container not found: $container"
              exit 1
            fi

            image="$(docker inspect --format '{{.Config.Image}}' "$container")"
            echo "$service -> $image"

            case "$image" in
              "ghcr.io/varianceworkplace/"*":${APP_RELEASE}")
                ;;
              *)
                echo "ERROR: Unexpected image for $service: $image"
                exit 1
                ;;
            esac

            status="$(docker inspect --format '{{.State.Status}}' "$container")"

            if [ "$status" != "running" ]; then
              echo "ERROR: $service is not running; status: $status"
              exit 1
            fi
          done

          echo "SUCCESS: All application containers are running the expected GHCR release."
          REMOTE