name: Plane CI/CD

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.web
          push: true
          tags: ghcr.io/varianceworkplace/plane-frontend:${{ github.sha }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.api
          push: true
          tags: ghcr.io/varianceworkplace/plane-backend:${{ github.sha }}

      - name: Build and push admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile.admin
          push: true
          tags: ghcr.io/varianceworkplace/plane-admin:${{ github.sha }}

      - name: Build and push space
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/space/Dockerfile.space
          push: true
          tags: ghcr.io/varianceworkplace/plane-space:${{ github.sha }}

      - name: Build and push live
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/live/Dockerfile.live
          push: true
          tags: ghcr.io/varianceworkplace/plane-live:${{ github.sha }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy Plane
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE: ${{ github.sha }}
          IMAGE_PREFIX: ghcr.io/varianceworkplace
        run: |
          set -euo pipefail

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_RELEASE='$RELEASE' PLANE_IMAGE_PREFIX='$IMAGE_PREFIX' bash -s" <<'REMOTE'
          set -euo pipefail

          cd /opt/plane-selfhost

          echo "Validating Docker Compose configuration..."
          docker compose --env-file plane.env config --quiet

          echo "Pulling application images for release: $APP_RELEASE"
          docker compose --env-file plane.env pull \
            web admin space live api worker beat-worker migrator

          echo "Running database migrations..."
          docker compose --env-file plane.env run --rm migrator

          echo "Updating application services..."
          docker compose --env-file plane.env up -d --no-deps \
            api worker beat-worker web admin space live

          echo "Current service status:"
          docker compose --env-file plane.env ps
          REMOTE