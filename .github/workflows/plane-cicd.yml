
name: Plane CI/CD

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: plane-develop-deployment
  cancel-in-progress: false

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.web
          push: true
          tags: ghcr.io/varianceworkplace/plane-frontend:${{ github.sha }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.api
          push: true
          tags: ghcr.io/varianceworkplace/plane-backend:${{ github.sha }}

      - name: Build and push admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile.admin
          push: true
          tags: ghcr.io/varianceworkplace/plane-admin:${{ github.sha }}

      - name: Build and push space
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/space/Dockerfile.space
          push: true
          tags: ghcr.io/varianceworkplace/plane-space:${{ github.sha }}

      - name: Build and push live
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/live/Dockerfile.live
          push: true
          tags: ghcr.io/varianceworkplace/plane-live:${{ github.sha }}

  deploy:
    name: Deploy Plane
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy and verify release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          RELEASE: ${{ github.sha }}
          IMAGE_PREFIX: ghcr.io/varianceworkplace
        run: |
          set -euo pipefail

          if [ -z "$GHCR_USERNAME" ] || [ -z "$GHCR_READ_TOKEN" ]; then
            echo "ERROR: GHCR_USERNAME or GHCR_READ_TOKEN is missing."
            exit 1
          fi

          TOKEN_B64="$(printf '%s' "$GHCR_READ_TOKEN" | base64 -w 0)"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_RELEASE='$RELEASE' \
             PLANE_IMAGE_PREFIX='$IMAGE_PREFIX' \
             GHCR_USERNAME='$GHCR_USERNAME' \
             GHCR_TOKEN_B64='$TOKEN_B64' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          cd /opt/plane-selfhost

          cleanup() {
            docker logout ghcr.io >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "Deploying commit: $APP_RELEASE"

          echo "Validating Docker Compose configuration..."
          docker compose --env-file plane.env config --quiet

          echo "Logging in to GitHub Container Registry..."
          printf '%s' "$GHCR_TOKEN_B64" \
            | base64 --decode \
            | docker login ghcr.io \
                --username "$GHCR_USERNAME" \
                --password-stdin

          echo "Pulling application images..."
          docker compose --env-file plane.env pull \
            web admin space live api worker beat-worker migrator

          echo "Running database migrations..."
          docker compose --env-file plane.env run --rm migrator

          echo "Recreating application services..."
          docker compose --env-file plane.env up \
            -d --no-deps --force-recreate \
            api worker beat-worker web admin space live

          echo "Verifying deployed image tags..."

          for service in api worker beat-worker web admin space live; do
            case "$service" in
              api|worker|beat-worker)
                expected="$PLANE_IMAGE_PREFIX/plane-backend:$APP_RELEASE"
                ;;
              web)
                expected="$PLANE_IMAGE_PREFIX/plane-frontend:$APP_RELEASE"
                ;;
              admin)
                expected="$PLANE_IMAGE_PREFIX/plane-admin:$APP_RELEASE"
                ;;
              space)
                expected="$PLANE_IMAGE_PREFIX/plane-space:$APP_RELEASE"
                ;;
              live)
                expected="$PLANE_IMAGE_PREFIX/plane-live:$APP_RELEASE"
                ;;
            esac

            container_id="$(docker compose --env-file plane.env ps -q "$service")"

            if [ -z "$container_id" ]; then
              echo "ERROR: No container found for $service"
              exit 1
            fi

            actual="$(docker inspect --format '{{.Config.Image}}' "$container_id")"

            echo "$service -> $actual"

            if [ "$actual" != "$expected" ]; then
              echo "ERROR: Image mismatch for $service"
              echo "Expected: $expected"
              echo "Actual:   $actual"
              exit 1
            fi

            state="$(docker inspect --format '{{.State.Status}}' "$container_id")"

            if [ "$state" != "running" ]; then
              echo "ERROR: $service is not running; state: $state"
              exit 1
            fi
          done

          echo "All seven application services use commit $APP_RELEASE"

          docker compose --env-file plane.env ps
          REMOTE